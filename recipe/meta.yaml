{% set name = "django-elasticsearch-dsl" %}
{% set version = "8.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6ecbe9688db7b0314f12067b781aa02750c849438b3ddd513a01054c56e21661

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - elasticsearch-dsl >=7.2.0
    - django >=1.9.6
    - python >=3.6
    - six

test:
  imports:
    - django_elasticsearch_dsl
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/django-es/django-elasticsearch-dsl
  summary: Wrapper around elasticsearch-dsl-py for django models
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MichelML
